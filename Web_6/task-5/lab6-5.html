<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна 6 — Завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">

        <div class="card">
            <div class="temp">17</div>
        </div>

        <!-- хмара: кілька накладених напівпрозорих кіл -->
        <div class="cloud">
            <span class="puff puff-1"></span>
            <span class="puff puff-2"></span>
            <span class="puff puff-3"></span>
            <span class="puff puff-4"></span>
            <span class="puff puff-5"></span>
        </div>

        <div class="arrows">
            <a class="arrow arrow-prev" href="#">&#10229;</a>
            <a class="arrow arrow-next" href="#">&#10230;</a>
        </div>

        <ul class="forecast">
            <li class="day"><span class="day-name">Mon</span><span class="day-temp">17°</span></li>
            <li class="day"><span class="day-name">Tue</span><span class="day-temp">19°</span></li>
            <li class="day"><span class="day-name">Wed</span><span class="day-temp">16°</span></li>
            <li class="day"><span class="day-name">Thu</span><span class="day-temp">18°</span></li>
            <li class="day"><span class="day-name">Fri</span><span class="day-temp">21°</span></li>
        </ul>

    </div>
</body>
</html>
